name: My First CI Pipeline

# This tells GitHub when to run the pipeline
on:
  push:
    branches: [ "main" ] # Runs every time you push code to the main branch

jobs:
  build-and-test:
    runs-on: ubuntu-latest # Runs the job on a clean Linux virtual machine

    steps:
      # Step 1: Check out your repository code into the runner
      - name: Check out code
        uses: actions/checkout@v4

      # Step 2: A simple command to verify things are working
      - name: Run a simple script
        run: |
          echo "Hello from your first CI/CD pipeline!"
          echo "Current date: $(date)"
          uname -a

      # Step 3: Check Docker version pre-installed on the runner
      - name: Check Docker version
        run: docker --version

      # Step 4: Build a temporary Docker image and run it locally
      - name: Build a Docker image
        run: |
          echo "FROM alpine:latest" > Dockerfile
          echo "RUN echo 'Hello from inside the Docker container!'" >> Dockerfile
          
          docker build -t my-test-app:latest .
          docker run --rm my-test-app:latest
